name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Unit and release-contract tests
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: uvx ruff check rock_lens_broker tests
      - name: Type check
        run: uvx ty check rock_lens_broker
      - name: Compile
        run: python -m compileall -q rock_lens_broker
