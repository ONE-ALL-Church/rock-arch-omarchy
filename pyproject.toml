[project]
name = "rock-arch"
version = "0.22.0"
requires-python = ">=3.11"
description = "Rock RMS search, public Rock knowledge, and optional Magnus for Omarchy"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
rock-arch-broker = "rock_lens_broker.__main__:main"

[tool.setuptools]
packages = ["rock_lens_broker"]
