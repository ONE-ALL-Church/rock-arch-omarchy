[project]
name = "rock-lens"
version = "0.10.2"
requires-python = ">=3.11"
description = "Native Rock RMS search and optional Magnus browser for Omarchy"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
rock-lens-broker = "rock_lens_broker.__main__:main"

[tool.setuptools]
packages = ["rock_lens_broker"]
