[project]
name = "rock-arch"
version = "0.26.0"
requires-python = ">=3.11"
description = "Rock RMS search, public Rock knowledge, and optional Magnus for Omarchy"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
rock-arch = "rock_arch_broker.cli:main"
rock-arch-broker = "rock_arch_broker.__main__:main"

[tool.setuptools]
packages = ["rock_arch_broker"]
